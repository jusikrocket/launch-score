<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발사 점수 적중률 검증 | 주식로케트</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080f}
#main{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06080f}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;z-index:-1}
</style>
</head>
<body>
<div class="fallback">주식로케트 발사 점수 페이지를 불러오는 중입니다.</div>
<iframe id="main" src="legacy-index.html?v=20260803-kns" title="주식로케트 발사 점수"></iframe>
<script>
(function(){
  const frame=document.getElementById('main');

  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument||frame.contentWindow.document;

      // 최신 종목 하얀 박스: 케이앤에스아이앤씨
      const feat=doc.querySelector('.feat');
      if(feat){
        feat.outerHTML=`<div class="feat">
    <div class="feat-top">
      <span class="feat-name">케이앤에스아이앤씨</span>
      <span class="feat-date">청약 전</span>
    </div>
    <div class="feat-row">
      <div class="feat-item"><div class="fl">발사 점수</div><div class="fv" style="color:var(--blue)">52점</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">판정</div><div class="fv" style="color:var(--blue)">청약고</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">청약일</div><div class="fv">08.04~05</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">시초가 수익률</div><div class="fv" style="color:var(--text3);font-weight:900">상장 전</div></div>
    </div>
    <a class="detail-link" style="position:absolute;right:14px;top:14px;width:116px;box-sizing:border-box;justify-content:center;white-space:nowrap;font-size:12px;padding:6px 12px;gap:6px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2" href="https://jusikrocket.github.io/launch-score/kns-inc.html?v=20260803" target="_blank">채점표</a>
    <a class="detail-link" style="position:absolute;right:14px;top:52px;width:116px;box-sizing:border-box;justify-content:center;white-space:nowrap;font-size:12px;padding:6px 12px;gap:6px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2" href="https://youtu.be/LAbzoRcoK7Q?si=ifBLs6Mabza0ZVya" target="_blank">발사 점수</a>
  </div>`;
      }

      const tbody=doc.querySelector('.tw table tbody');
      if(tbody){
        function ensurePair(name, rowHtml, detailHtml){
          let resultRow=[...tbody.querySelectorAll('tr:not(.detail-row)')]
            .find(row=>row.textContent.includes(name));
          let detailRow=doc.getElementById('detail-'+name)?.closest('tr');

          if(!resultRow){
            resultRow=doc.createElement('tr');
            resultRow.innerHTML=rowHtml;
          }else{
            resultRow.innerHTML=rowHtml;
          }

          if(!detailRow){
            detailRow=doc.createElement('tr');
            detailRow.className='detail-row';
          }
          detailRow.innerHTML=detailHtml;
          return {resultRow,detailRow};
        }

        // 에이치엘지노믹스: 최신 목록 세 번째
        const hlg=ensurePair(
          '에이치엘지노믹스',
          `<td>3</td>
<td class="nm"><span class="nm-link" onclick="toggleDetail('에이치엘지노믹스')">에이치엘지노믹스 <span class="nm-arrow" id="arrow-에이치엘지노믹스">▶</span></span></td>
<td>07/24</td>
<td>21,500원</td>
<td><span class="sb h">66</span></td>
<td style="color:var(--blue)">청약고</td>
<td class="rt pos">0.0%<br><span style="font-size:10px;color:var(--green);white-space:nowrap">초반 최고 +18.84%</span></td>
<td><span class="rb hit">✅ 적중</span></td>`,
          `<td colspan="8"><div class="detail-inner" id="detail-에이치엘지노믹스">
<a class="detail-link" href="https://jusikrocket.github.io/launch-score/hlg-genomics.html?v=20260729-hit" target="_blank">채점표</a>
<a class="detail-link" href="https://www.youtube.com/watch?v=kE49pOTlx_4" target="_blank">발사 점수</a>
<span style="font-size:12px;color:var(--text2);align-self:center">시초가는 공모가와 같았지만 상장 초반 25,550원, 공모가 대비 +18.84% 수익 구간 발생</span>
</div></td>`
        );

        // 인제니아테라퓨틱스: 최신 목록 두 번째
        const ingenia=ensurePair(
          '인제니아테라퓨틱스',
          `<td>2</td>
<td class="nm"><span class="nm-link" onclick="toggleDetail('인제니아테라퓨틱스')">인제니아테라퓨틱스 <span class="nm-arrow" id="arrow-인제니아테라퓨틱스">▶</span></span></td>
<td>상장 전</td>
<td>12,000원</td>
<td><span class="sb h">46</span></td>
<td style="color:var(--blue)">청약고</td>
<td class="rt" style="color:var(--text3)">상장 전</td>
<td><span class="rb">상장 전</span></td>`,
          `<td colspan="8"><div class="detail-inner" id="detail-인제니아테라퓨틱스">
<a class="detail-link" href="https://jusikrocket.github.io/launch-score/ingenia-therapeutics.html?v=20260731" target="_blank">채점표</a>
<a class="detail-link" href="https://www.youtube.com/watch?v=pwlxrrrsLPs&t=1s" target="_blank">발사 점수</a>
<span style="font-size:12px;color:var(--text2);align-self:center">46점 · 청약고 · 기관 경쟁률 50.4대 1, 장기확약 0.024% · 균등 중심, 비례 신중</span>
</div></td>`
        );

        // 기존 하얀 박스 종목 딜리셔스: 최신 목록 첫 번째
        const dealicious=ensurePair(
          '딜리셔스',
          `<td>1</td>
<td class="nm"><span class="nm-link" onclick="toggleDetail('딜리셔스')">딜리셔스 <span class="nm-arrow" id="arrow-딜리셔스">▶</span></span></td>
<td>상장 전</td>
<td>7,000원</td>
<td><span class="sb h">46</span></td>
<td style="color:var(--blue)">청약고</td>
<td class="rt" style="color:var(--text3)">상장 전</td>
<td><span class="rb">상장 전</span></td>`,
          `<td colspan="8"><div class="detail-inner" id="detail-딜리셔스">
<a class="detail-link" href="https://jusikrocket.github.io/launch-score/dealicious.html?v=20260731" target="_blank">채점표</a>
<a class="detail-link" href="https://www.youtube.com/watch?v=2oTfXVqKpHM" target="_blank">발사 점수</a>
<span style="font-size:12px;color:var(--text2);align-self:center">46점 · 청약고 기준 45점보다 단 1점 높은 턱걸이 판정 · 균등 중심, 비례 신중</span>
</div></td>`
        );

        // 기존 하얀 박스의 딜리셔스를 최신 1번으로 이동하고 최신 목록 순서를 유지
        [dealicious.resultRow,dealicious.detailRow,ingenia.resultRow,ingenia.detailRow,hlg.resultRow,hlg.detailRow].forEach(el=>{
          if(el.parentNode===tbody) tbody.removeChild(el);
        });
        const first=tbody.firstElementChild;
        const fragment=doc.createDocumentFragment();
        [dealicious.resultRow,dealicious.detailRow,ingenia.resultRow,ingenia.detailRow,hlg.resultRow,hlg.detailRow].forEach(el=>fragment.appendChild(el));
        tbody.insertBefore(fragment,first);

        // 번호 재정렬
        [...tbody.querySelectorAll('tr:not(.detail-row)')].forEach((row,index)=>{
          if(row.cells && row.cells[0]) row.cells[0].textContent=String(index+1);
        });
      }
    }catch(err){
      console.error('케이앤에스아이앤씨 최신 종목 업데이트 실패',err);
    }
  });
})();
</script>
<noscript><p style="color:white;text-align:center"><a style="color:#ff6b35" href="legacy-index.html">페이지 열기</a></p></noscript>
</body>
</html>
