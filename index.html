<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발사 점수 적중률 검증 | 주식로케트</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080f}
#main{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06080f}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;z-index:-1}
</style>
</head>
<body>
<div class="fallback">주식로케트 발사 점수 페이지를 불러오는 중입니다.</div>
<iframe id="main" src="legacy-index.html?v=20260729-hlg-hit" title="주식로케트 발사 점수"></iframe>
<script>
(function(){
  const frame=document.getElementById('main');

  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument||frame.contentWindow.document;

      // 최신 종목 하얀 박스
      const feat=doc.querySelector('.feat');
      if(feat){
        feat.outerHTML=`<div class="feat">
    <div class="feat-top">
      <span class="feat-name">에이치엘지노믹스</span>
      <span class="feat-date">2026.07.24 상장 · 적중</span>
    </div>
    <div class="feat-row">
      <div class="feat-item"><div class="fl">발사 점수</div><div class="fv" style="color:var(--blue)">66점</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">판정</div><div class="fv" style="color:var(--blue)">청약고</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">상장 초반 최고</div><div class="fv" style="color:var(--green)">+18.84%</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">결과</div><div class="fv" style="color:var(--green)">✅ 적중</div></div>
    </div>
    <a class="detail-link" style="position:absolute;right:14px;top:14px;width:116px;box-sizing:border-box;justify-content:center;white-space:nowrap;font-size:12px;padding:6px 12px;gap:6px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2" href="https://jusikrocket.github.io/launch-score/hlg-genomics.html?v=20260729-hit" target="_blank">채점표</a>
    <a class="detail-link" style="position:absolute;right:14px;top:52px;width:116px;box-sizing:border-box;justify-content:center;white-space:nowrap;font-size:12px;padding:6px 12px;gap:6px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2" href="https://www.youtube.com/watch?v=kE49pOTlx_4" target="_blank">발사 점수</a>
  </div>`;
      }

      // 검증 표에 에이치엘지노믹스 추가 또는 갱신
      const tbody=doc.querySelector('.tw table tbody');
      if(tbody){
        let resultRow=[...tbody.querySelectorAll('tr:not(.detail-row)')]
          .find(row=>row.textContent.includes('에이치엘지노믹스'));
        let detailRow=doc.getElementById('detail-에이치엘지노믹스')?.closest('tr');

        if(!resultRow){
          resultRow=doc.createElement('tr');
          resultRow.innerHTML=`<td>1</td>
<td class="nm"><span class="nm-link" onclick="toggleDetail('에이치엘지노믹스')">에이치엘지노믹스 <span class="nm-arrow" id="arrow-에이치엘지노믹스">▶</span></span></td>
<td>07/24</td>
<td>21,500원</td>
<td><span class="sb h">66</span></td>
<td style="color:var(--blue)">청약고</td>
<td class="rt pos">0.0%<br><span style="font-size:10px;color:var(--green);white-space:nowrap">초반 최고 +18.84%</span></td>
<td><span class="rb hit">✅ 적중</span></td>`;

          detailRow=doc.createElement('tr');
          detailRow.className='detail-row';
          detailRow.innerHTML=`<td colspan="8"><div class="detail-inner" id="detail-에이치엘지노믹스">
<a class="detail-link" href="https://jusikrocket.github.io/launch-score/hlg-genomics.html?v=20260729-hit" target="_blank">채점표</a>
<a class="detail-link" href="https://www.youtube.com/watch?v=kE49pOTlx_4" target="_blank">발사 점수</a>
<span style="font-size:12px;color:var(--text2);align-self:center">시초가는 공모가와 같았지만 상장 초반 25,550원, 공모가 대비 +18.84% 수익 구간 발생</span>
</div></td>`;

          const first=tbody.firstElementChild;
          tbody.insertBefore(detailRow,first);
          tbody.insertBefore(resultRow,detailRow);
        }else{
          const cells=resultRow.children;
          if(cells.length>=8){
            cells[2].textContent='07/24';
            cells[3].textContent='21,500원';
            cells[4].innerHTML='<span class="sb h">66</span>';
            cells[5].textContent='청약고';
            cells[5].style.color='var(--blue)';
            cells[6].className='rt pos';
            cells[6].innerHTML='0.0%<br><span style="font-size:10px;color:var(--green);white-space:nowrap">초반 최고 +18.84%</span>';
            cells[7].innerHTML='<span class="rb hit">✅ 적중</span>';
          }
        }

        // 번호 재정렬
        [...tbody.querySelectorAll('tr:not(.detail-row)')].forEach((row,index)=>{
          if(row.cells && row.cells[0]) row.cells[0].textContent=String(index+1);
        });
      }
    }catch(err){
      console.error('에이치엘지노믹스 적중 업데이트 실패',err);
    }
  });
})();
</script>
<noscript><p style="color:white;text-align:center"><a style="color:#ff6b35" href="legacy-index.html">페이지 열기</a></p></noscript>
</body>
</html>
