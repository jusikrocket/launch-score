name: Update HLG featured card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-hlg-featured.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace latest featured card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          start_marker = '<div class="feat">'
          section_end = '</section>'

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("featured card start not found")

          end = text.find(section_end, start)
          if end < 0:
              raise SystemExit("featured section end not found")

          new_block = """<div class="feat">
    <div class="feat-top">
      <span class="feat-name">에이치엘지노믹스</span>
      <span class="feat-date">상장 전</span>
    </div>
    <div class="feat-row">
      <div class="feat-item"><div class="fl">발사 점수</div><div class="fv" style="color:var(--blue)">66점</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">판정</div><div class="fv" style="color:var(--blue)">청약고</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">청약일</div><div class="fv">07.13~14</div></div>
      <div class="feat-div"></div>
      <div class="feat-item"><div class="fl">시초가 수익률</div><div class="fv" style="color:var(--text3);font-weight:900">상장 전</div></div>
    </div>
    <a class="detail-link" style="position:absolute;right:14px;top:14px;width:116px;box-sizing:border-box;justify-content:center;white-space:nowrap;font-size:12px;padding:6px 12px;gap:6px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2" href="https://jusikrocket.github.io/launch-score/hlg-genomics.html" target="_blank">채점표</a>
    <a class="detail-link" style="position:absolute;right:14px;top:52px;width:116px;box-sizing:border-box;justify-content:center;white-space:nowrap;font-size:12px;padding:6px 12px;gap:6px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2" href="https://www.youtube.com/watch?v=kE49pOTlx_4" target="_blank">발사 점수</a>
  </div>
"""

          text = text[:start] + new_block + text[end:]
          path.write_text(text, encoding="utf-8")
          print("featured card updated")
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/update-hlg-featured.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-hlg-featured.yml
          git commit -m "Update latest IPO to HLG Genomics"
          git push
